<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Sim_Bio_Cortex 3D 인체 지도 — 구조물을 클릭하면 옵시디언 지식 노트로 연결"
    />
    <title>Sim_Bio_Atlas</title>
    <link rel="icon" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // 렌더 전 테마 확정 (플래시 방지) — theme.ts 와 동일 규칙
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('sbcTheme');
          var t =
            p === 'dark' || p === 'light'
              ? p
              : localStorage.getItem('sbc-atlas-theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
